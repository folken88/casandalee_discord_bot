services:
  cass-bot:
    build: .
    container_name: cass-discord-bot
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./obsidian_cass:/app/obsidian_cass
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      - BOT_NAME=Casandalee
      - BOT_PREFIX=/cass
      - CAMPAIGN_YEAR=4717
      - CAMPAIGN_MONTH=April
    networks:
      - cass-network
      - ollama-network

networks:
  cass-network:
    driver: bridge
  ollama-network:
    external: true
    name: docker-services_ollama-network
